<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Email</title>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Blog</h1>
        <p>Hello {{ username }},</p>
        <p>Thank you for subscribing to my blog. You will now receive updates about {{ course }}.</p>
        <p>Best regards,<br>The My Blog Team</p>
        <hr>
        <small>This is an automated email. Please do not reply.</small>
    </div>
</body>
</html>
