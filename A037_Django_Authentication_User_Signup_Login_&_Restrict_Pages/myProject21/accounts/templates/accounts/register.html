{% extends "accounts/base.html" %}
{% block content %}
    <h2>Register</h2>
    <form method="POST">
        {% csrf_token %}
        {% comment %} <p>Username: <input type="text" name="username"></p>
        <p>Email: <input type="email" name="email"></p>
        <p>Password: <input type="password" name="password"></p> {% endcomment %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
{% endblock %}
