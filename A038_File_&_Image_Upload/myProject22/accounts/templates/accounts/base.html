<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Django File & Image Upload</title>
</head>
<body>
    <a href="{% url 'upload_profile' %}">Upload Profile</a> |
    <a href="{% url 'view_profile' %}">View Profile</a>

    <hr>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}
    {% endblock %}
</body>
</html>
