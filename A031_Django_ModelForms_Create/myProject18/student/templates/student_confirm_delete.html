<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Delete</title>
</head>
<body>
    <h2>Delete {{ student.name }}</h2>
    <p>Are you sure you want to delete this student?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'student_list' %}">Cancel</a>
    </form>
</body>
</html>
