<!DOCTYPE html>
<html lang="en">
<head>
    <title>All Messages Data</title>
    <style>
        .debug { color: blue; }
        .info { color: green; }
        .success { color: green; }
        .warning { color: orange; }
        .error { color: red; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>All Messages Data</h1>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li class="{{message.tags}}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No messages available.</p>
    {% endif %}
</body>
</html>
